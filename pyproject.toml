[project]
name = "haloqon"
version = "0.1.0"
description = "CLI for the Ultraloq Latch 5 Pro over BLE (native protocol, no cloud)."
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "click>=8.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
haloqon = "haloqon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haloqon"]
